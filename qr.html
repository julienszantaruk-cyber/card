<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan to connect — Julien Grimond-Szantaruk</title>
<meta name="theme-color" content="#0b1f3a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b1f3a'/><text y='68' x='50' text-anchor='middle' font-size='44' font-family='Georgia,serif' fill='%23e8b64c' font-weight='bold'>J</text></svg>">
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(165deg,#0b1f3a,#132c4f);
  color:#fff;text-align:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding:32px 20px calc(32px + env(safe-area-inset-bottom));
}
h1{font-size:22px;margin:0 0 4px;font-weight:650;letter-spacing:-.2px}
.role{color:#e8b64c;font-size:14px;font-weight:600;margin:0 0 2px}
.org{color:rgba(255,255,255,.6);font-size:12.5px;margin:0 0 26px}
.qr-frame{
  background:#fff;padding:18px;border-radius:22px;
  box-shadow:0 18px 50px rgba(0,0,0,.42);
  line-height:0;
}
#qr{width:min(70vw,270px);height:min(70vw,270px);display:block;image-rendering:pixelated}
.hint{margin:24px 0 0;font-size:13.5px;color:rgba(255,255,255,.62);letter-spacing:.3px}
.url{margin:10px 0 0;font-size:11.5px;color:rgba(255,255,255,.38);word-break:break-all;max-width:320px}
.err{margin:18px 0 0;font-size:13px;color:#ffb4b4;max-width:320px;display:none}
a.back{
  margin-top:30px;color:#e8b64c;text-decoration:none;
  font-size:14px;font-weight:600;
  border:1px solid rgba(232,182,76,.4);
  padding:11px 24px;border-radius:999px;
  transition:background .15s;
}
a.back:active{background:rgba(232,182,76,.14)}
@media print{
  body{background:#fff;color:#000}
  .role{color:#8a6a1e}.org,.hint,.url{color:#555}
  .qr-frame{box-shadow:none;border:1px solid #ddd}
  a.back{display:none}
}
</style>
</head>
<body>

<h1>Julien Grimond-Szantaruk</h1>
<p class="role">Head of Communications</p>
<p class="org">UTTOP · Tarbes, France</p>

<div class="qr-frame"><canvas id="qr" width="270" height="270"></canvas></div>

<p class="hint">Scan to open my digital card</p>
<p class="url" id="urlTxt"></p>
<p class="err" id="errTxt"></p>

<a class="back" href="index.html">← Back to my card</a>

<script>
/* =====================================================================
   Générateur de QR code minimal et autonome.
   Mode byte, niveau de correction Q, versions 1 à 10.
   Aucune dépendance externe.
   ===================================================================== */
(function(){
"use strict";

/* ---- Arithmétique de Galois GF(256) pour Reed-Solomon ---- */
var EXP = new Uint8Array(512), LOG = new Uint8Array(256);
(function(){
  var x = 1;
  for (var i = 0; i < 255; i++){
    EXP[i] = x;
    LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11D;
  }
  for (i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
})();

function gmul(a, b){
  if (a === 0 || b === 0) return 0;
  return EXP[LOG[a] + LOG[b]];
}

/* Polynôme générateur de degré n */
function rsGenerator(n){
  var poly = [1];
  for (var i = 0; i < n; i++){
    var next = new Array(poly.length + 1).fill(0);
    for (var j = 0; j < poly.length; j++){
      next[j]     ^= gmul(poly[j], EXP[i]);
      next[j + 1] ^= poly[j];
    }
    poly = next;
  }
  return poly;
}

/* Octets de correction d'erreur */
function rsEncode(data, ecLen){
  var gen = rsGenerator(ecLen);
  var res = new Uint8Array(data.length + ecLen);
  res.set(data);
  for (var i = 0; i < data.length; i++){
    var factor = res[i];
    if (factor === 0) continue;
    for (var j = 0; j < gen.length; j++){
      res[i + j] ^= gmul(gen[j], factor);
    }
  }
  return res.slice(data.length);
}

/* ---- Tables de capacité (mode byte, niveau Q) ----
   [ version, taille module, capacité octets,
     octets EC par bloc, nb blocs groupe1, nb blocs groupe2 ]  */
var VERSIONS = [
  [ 1, 21,   11, 13,  1, 0],
  [ 2, 25,   20, 22,  1, 0],
  [ 3, 29,   32, 18,  2, 0],
  [ 4, 33,   46, 26,  2, 0],
  [ 5, 37,   60, 18,  2, 2],
  [ 6, 41,   74, 24,  4, 0],
  [ 7, 45,   86, 18,  2, 4],
  [ 8, 49,  108, 22,  4, 2],
  [ 9, 53,  130, 20,  4, 4],
  [10, 57,  151, 24,  6, 2]
];

/* Positions des motifs d'alignement par version */
var ALIGN = [
  [], [], [6,18], [6,22], [6,26], [6,30], [6,34],
  [6,22,38], [6,24,42], [6,26,46], [6,28,50]
];

/* ---- Écriture bit à bit ---- */
function BitBuffer(){ this.bits = []; }
BitBuffer.prototype.put = function(value, length){
  for (var i = length - 1; i >= 0; i--){
    this.bits.push((value >>> i) & 1);
  }
};

/* ---- Construction du QR ---- */
function makeQR(text){
  /* UTF-8 */
  var utf8 = [];
  var encoded = encodeURIComponent(text);
  for (var i = 0; i < encoded.length; i++){
    if (encoded[i] === "%"){
      utf8.push(parseInt(encoded.substr(i + 1, 2), 16));
      i += 2;
    } else {
      utf8.push(encoded.charCodeAt(i));
    }
  }

  /* Choix de la version */
  var spec = null;
  for (i = 0; i < VERSIONS.length; i++){
    if (utf8.length <= VERSIONS[i][2]){ spec = VERSIONS[i]; break; }
  }
  if (!spec) throw new Error("URL trop longue pour ce générateur.");

  var version = spec[0], size = spec[1], totalData = spec[2];
  var ecPerBlock = spec[3], blocks1 = spec[4], blocks2 = spec[5];
  var totalBlocks = blocks1 + blocks2;

  /* Flux de données : mode byte (0100) + longueur + charge utile */
  var buf = new BitBuffer();
  buf.put(4, 4);
  buf.put(utf8.length, version < 10 ? 8 : 16);
  for (i = 0; i < utf8.length; i++) buf.put(utf8[i], 8);

  /* Terminateur + alignement octet */
  var capacityBits = totalData * 8;
  var pad = Math.min(4, capacityBits - buf.bits.length);
  for (i = 0; i < pad; i++) buf.bits.push(0);
  while (buf.bits.length % 8 !== 0) buf.bits.push(0);

  /* Octets de remplissage alternés */
  var bytes = [];
  for (i = 0; i < buf.bits.length; i += 8){
    var b = 0;
    for (var k = 0; k < 8; k++) b = (b << 1) | buf.bits[i + k];
    bytes.push(b);
  }
  var padBytes = [0xEC, 0x11], p = 0;
  while (bytes.length < totalData) bytes.push(padBytes[p++ % 2]);

  /* Découpage en blocs (groupe 2 = un octet de plus) */
  var shortLen = Math.floor(totalData / totalBlocks);
  var dataBlocks = [], ecBlocks = [], offset = 0;
  for (i = 0; i < totalBlocks; i++){
    var len = shortLen + (i >= blocks1 ? 1 : 0);
    var chunk = Uint8Array.from(bytes.slice(offset, offset + len));
    offset += len;
    dataBlocks.push(chunk);
    ecBlocks.push(rsEncode(chunk, ecPerBlock));
  }

  /* Entrelacement */
  var finalBytes = [];
  var maxData = Math.max.apply(null, dataBlocks.map(function(b){ return b.length; }));
  for (i = 0; i < maxData; i++){
    for (var j = 0; j < totalBlocks; j++){
      if (i < dataBlocks[j].length) finalBytes.push(dataBlocks[j][i]);
    }
  }
  for (i = 0; i < ecPerBlock; i++){
    for (j = 0; j < totalBlocks; j++) finalBytes.push(ecBlocks[j][i]);
  }

  /* ---- Matrice ---- */
  var m = [], reserved = [];
  for (i = 0; i < size; i++){
    m.push(new Array(size).fill(0));
    reserved.push(new Array(size).fill(false));
  }

  function setFn(r, c, v){
    if (r < 0 || c < 0 || r >= size || c >= size) return;
    m[r][c] = v; reserved[r][c] = true;
  }

  /* Motifs de détection de position */
  function finder(r, c){
    for (var dr = -1; dr <= 7; dr++){
      for (var dc = -1; dc <= 7; dc++){
        var rr = r + dr, cc = c + dc;
        if (rr < 0 || cc < 0 || rr >= size || cc >= size) continue;
        var inRing  = (dr === 0 || dr === 6 || dc === 0 || dc === 6) &&
                      (dr >= 0 && dr <= 6 && dc >= 0 && dc <= 6);
        var inCore  = dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4;
        setFn(rr, cc, (inRing || inCore) ? 1 : 0);
      }
    }
  }
  finder(0, 0); finder(0, size - 7); finder(size - 7, 0);

  /* Motifs de synchronisation */
  for (i = 8; i < size - 8; i++){
    var v = (i % 2 === 0) ? 1 : 0;
    setFn(6, i, v); setFn(i, 6, v);
  }

  /* Motifs d'alignement */
  var coords = ALIGN[version];
  for (i = 0; i < coords.length; i++){
    for (var j2 = 0; j2 < coords.length; j2++){
      var ar = coords[i], ac = coords[j2];
      if ((ar === 6 && ac === 6) ||
          (ar === 6 && ac === size - 7) ||
          (ar === size - 7 && ac === 6)) continue;
      for (var dr2 = -2; dr2 <= 2; dr2++){
        for (var dc2 = -2; dc2 <= 2; dc2++){
          var ring = Math.max(Math.abs(dr2), Math.abs(dc2));
          setFn(ar + dr2, ac + dc2, (ring === 1) ? 0 : 1);
        }
      }
    }
  }

  /* Module sombre + zones réservées pour l'information de format */
  setFn(size - 8, 8, 1);
  for (i = 0; i <= 8; i++){
    if (!reserved[8][i])            reserved[8][i] = true;
    if (!reserved[i][8])            reserved[i][8] = true;
  }
  for (i = 0; i < 8; i++){
    reserved[8][size - 1 - i] = true;
    reserved[size - 1 - i][8] = true;
  }

  /* Placement des données en zigzag */
  var bitIdx = 0, totalBits = finalBytes.length * 8;
  function nextBit(){
    if (bitIdx >= totalBits) return 0;
    var byteVal = finalBytes[bitIdx >>> 3];
    var bit = (byteVal >>> (7 - (bitIdx & 7))) & 1;
    bitIdx++;
    return bit;
  }

  var upward = true;
  for (var col = size - 1; col > 0; col -= 2){
    if (col === 6) col--;                 /* on saute la colonne de synchro */
    for (var step = 0; step < size; step++){
      var row = upward ? (size - 1 - step) : step;
      for (var d = 0; d < 2; d++){
        var cc2 = col - d;
        if (reserved[row][cc2]) continue;
        var bit = nextBit();
        /* Masque 0 : (row + col) % 2 === 0 */
        if ((row + cc2) % 2 === 0) bit ^= 1;
        m[row][cc2] = bit;
      }
    }
    upward = !upward;
  }

  /* Information de format : niveau Q (0b11) + masque 0 (0b000) */
  var fmtData = 0x18;                     /* 11000 */
  var rem = fmtData;
  for (i = 0; i < 10; i++){
    rem = (rem << 1) ^ (((rem >>> 9) & 1) * 0x537);
  }
  var fmt = ((fmtData << 10) | rem) ^ 0x5412;

  for (i = 0; i < 15; i++){
    var bitVal = (fmt >>> (14 - i)) & 1;
    /* Copie 1 : autour du motif haut-gauche */
    if (i < 6)        m[8][i] = bitVal;
    else if (i < 8)   m[8][i + 1] = bitVal;
    else if (i === 8) m[7][8] = bitVal;
    else              m[14 - i][8] = bitVal;
    /* Copie 2 : répartie en bas-gauche et haut-droite */
    if (i < 8)        m[size - 1 - i][8] = bitVal;
    else              m[8][size - 15 + i] = bitVal;
  }

  return m;
}

/* ---- Rendu sur canvas ---- */
function render(matrix, canvas){
  var quiet = 4;
  var modules = matrix.length;
  var total = modules + quiet * 2;
  var scale = 8;                            /* résolution interne élevée */

  canvas.width  = total * scale;
  canvas.height = total * scale;

  var ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#0b1f3a";

  for (var r = 0; r < modules; r++){
    for (var c = 0; c < modules; c++){
      if (matrix[r][c]){
        ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
      }
    }
  }
}

/* ---- Lancement ---- */
var target = new URL("index.html", window.location.href).href;
document.getElementById("urlTxt").textContent = target.replace(/^https?:\/\//, "");

try{
  render(makeQR(target), document.getElementById("qr"));
}catch(e){
  var err = document.getElementById("errTxt");
  err.textContent = "QR unavailable — please share the link above manually.";
  err.style.display = "block";
  console.error(e);
}
})();
</script>

</body>
</html>
