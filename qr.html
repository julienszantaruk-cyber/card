<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan to connect — Julien Grimond-Szantaruk</title>
<meta name="theme-color" content="#0b1f3a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b1f3a'/><text y='68' x='50' text-anchor='middle' font-size='44' font-family='Georgia,serif' fill='%23e8b64c' font-weight='bold'>J</text></svg>">
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(165deg,#0b1f3a,#132c4f);
  color:#fff;text-align:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding:32px 20px calc(32px + env(safe-area-inset-bottom));
}
h1{font-size:22px;margin:0 0 4px;font-weight:650;letter-spacing:-.2px}
.role{color:#e8b64c;font-size:14px;font-weight:600;margin:0 0 2px}
.org{color:rgba(255,255,255,.6);font-size:12.5px;margin:0 0 26px}
.qr-frame{
  background:#fff;padding:18px;border-radius:22px;
  box-shadow:0 18px 50px rgba(0,0,0,.42);
  line-height:0;
}
.qr-frame img{
  width:min(70vw,270px);
  height:auto;
  display:block;
  image-rendering:pixelated;
}
.hint{margin:24px 0 0;font-size:13.5px;color:rgba(255,255,255,.62);letter-spacing:.3px}
.url{margin:10px 0 0;font-size:11.5px;color:rgba(255,255,255,.38);word-break:break-all;max-width:320px}
a.back{
  margin-top:30px;color:#e8b64c;text-decoration:none;
  font-size:14px;font-weight:600;
  border:1px solid rgba(232,182,76,.4);
  padding:11px 24px;border-radius:999px;
  transition:background .15s;
}
a.back:active{background:rgba(232,182,76,.14)}
@media print{
  body{background:#fff;color:#000;min-height:auto;padding:40px 20px}
  h1{color:#0b1f3a}
  .role{color:#8a6a1e}
  .org,.hint,.url{color:#555}
  .qr-frame{box-shadow:none;border:1px solid #ddd}
  .qr-frame img{width:220px}
  a.back{display:none}
}
</style>
</head>
<body>

<h1>Julien Grimond-Szantaruk</h1>
<p class="role">Head of Communications</p>
<p class="org">UTTOP — University of Technology of Tarbes</p>

<div class="qr-frame">
  <img src="qr.png" alt="QR code linking to Julien Grimond-Szantaruk's digital business card">
</div>

<p class="hint">Scan to open my digital card</p>
<p class="url">julienszantaruk-cyber.github.io/card</p>

<a class="back" href="index.html">← Back to my card</a>

</body>
</html>
